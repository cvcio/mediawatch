version: '3.2'

services:
  reverse-proxy:
    image: traefik # The official Traefik docker image
    command: --api.insecure=true --providers.docker # Enables the web UI and tells Traefik to listen to docker
    ports:
      - "80:80"     # The HTTP port
      - "8082:8080" # The Web UI (enabled by --api)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # So that Traefik can listen to the Docker events

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    ports:
      - 9200:9200
      - 9300:9300
    environment:
     - discovery.type=single-node
     - bootstrap.memory_lock=true
     - ES_JAVA_OPTS=-Xms4g -Xmx4g
     - network.host=0.0.0.0
     - xpack.security.enabled=false
    volumes:
      - data_elasticsearh:/usr/share/elasticsearch/data
    labels:
      - "traefik.frontend.rule=Host:elasticsearch.docker.localhost"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    ports:
      - 5601:5601
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    labels:
      - "traefik.frontend.rule=Host:kibana.docker.localhost"

  mongo:
    image: mongo:latest
    ports: 
      - 27017:27017
    volumes:
      - data_mongo:/data/db
    labels:
      - "traefik.frontend.rule=Host:mongo.docker.localhost"
      - "app=mediawatch"
  
  mongo-express:
    image: mongo-express
    ports:
      - 8081:8081
    links:
      - mongo:mongo
    depends_on:
      - mongo
    labels:
      - "traefik.frontend.rule=Host:express.docker.localhost"

  neo4j:
    image: neo4j:5.26.0
    ports:
      - 7474:7474
      - 7473:7473
      - 7687:7687
    environment:
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_AUTH=none
      - NEO4J_dbms_allow__upgrade=true
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_initial_dbms_default__database=mediawatch
    volumes:
      - data_neo4j_data:/data
      - $PWD/tmp:/export
    labels:
      - "traefik.frontend.rule=Host:neo4j.docker.localhost"

  redis:
    image: redis:8
    ports:
      - 6379:6379

  kafka:
    image: confluentinc/cp-kafka:8.1.0
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_NODE_ID: 0
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_CLEANUP_POLICY: compact,delete
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_LINGER_MS: 0
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_MS: 120000
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --list --bootstrap-server localhost:9092 || exit 1"]
      interval: 1s
      timeout: 60s
      retries: 50

  kafka-init:
    image: confluentinc/cp-kafka:8.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      sleep 5
      kafka-topics --create --topic worker --partitions 1 --config cleanup.policy=compact,delete --if-not-exists --bootstrap-server kafka:9092
      kafka-topics --create --topic compare --partitions 1 --config cleanup.policy=compact,delete --if-not-exists --bootstrap-server kafka:9092
      kafka-topics --create --topic enrich --partitions 1 --config cleanup.policy=compact,delete --if-not-exists --bootstrap-server kafka:9092
      kafka-topics --create --topic store --partitions 1 --config cleanup.policy=compact,delete --if-not-exists --bootstrap-server kafka:9092
      kafka-topics --create --topic scrape --partitions 1 --config cleanup.policy=compact,delete --if-not-exists --bootstrap-server kafka:9092
      kafka-topics --bootstrap-server kafka:9092 --list
      "
    restart: "no"

volumes:
  data_neo4j_data: 
  data_mongo:
  data_elasticsearh:
  data_kafka:
